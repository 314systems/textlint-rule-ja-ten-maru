name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pnpm requires at least Node.js v22.13
        node-version: ['22.13', '24']
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup pnpm
        uses: pnpm/setup@v3.2.0
        with:
          runtime: node@${{ matrix.node-version }}
          cache: true

      - run: pnpm lint
      - run: pnpm fmt:check
      - run: pnpm test
      - run: pnpm build
